name: Zelô CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Backend — testes e lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-zeladoria

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Lint (flake8)
        run: flake8 app/ --max-line-length=120 --exclude=__pycache__ --ignore=E501,W503

      - name: Testes (pytest)
        env:
          DATABASE_URL: "sqlite:///./test.db"
          SECRET_KEY: "test-secret-key-ci"
          POPULATE_DATA: "false"
        run: |
          pytest tests/ -v --tb=short --cov=app --cov-report=term-missing || true

  test-frontend:
    name: Frontend — build check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependências
        run: npm ci --silent

      - name: Build de produção
        run: npm run build
        env:
          VITE_API_URL: "https://zeladoria-backend-production.up.railway.app"

  deploy-check:
    name: Validação pré-deploy
    runs-on: ubuntu-latest
    needs: [test-backend]

    steps:
      - uses: actions/checkout@v4

      - name: Verificar Dockerfile backend
        run: docker build -t zelo-backend-test ./python-zeladoria --no-cache --quiet

      - name: Health check simulado
        run: echo "✅ Imagem construída com sucesso — pronta para deploy"
