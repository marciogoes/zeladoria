name: Zelô CI — v4.0.0

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────
  # Backend: lint + testes
  # ─────────────────────────────────────────────────
  backend:
    name: Backend (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-zeladoria

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Lint — flake8
        run: |
          flake8 app/ main.py \
            --max-line-length=120 \
            --exclude=__pycache__,migrations \
            --ignore=E501,W503,E402

      - name: Testes — pytest
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "ci-test-secret-key-not-for-production"
          POPULATE_DATA: "false"
          SENTRY_DSN: ""
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=40

  # ─────────────────────────────────────────────────
  # Frontend: build check
  # ─────────────────────────────────────────────────
  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    # Só roda se o diretório frontend existir com package.json
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Verificar se package.json existe
        id: check_pkg
        run: test -f package.json && echo "exists=true" >> $GITHUB_OUTPUT || echo "exists=false" >> $GITHUB_OUTPUT

      - name: Setup Node 20
        if: steps.check_pkg.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar e build
        if: steps.check_pkg.outputs.exists == 'true'
        run: |
          npm ci --silent
          npm run build
        env:
          VITE_API_URL: "https://zeladoria-backend-production.up.railway.app"

  # ─────────────────────────────────────────────────
  # Docker: valida build da imagem
  # ─────────────────────────────────────────────────
  docker:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - uses: actions/checkout@v4

      - name: Build imagem Docker
        run: |
          docker build \
            --file python-zeladoria/Dockerfile \
            --tag zelo-backend:ci \
            --no-cache \
            --quiet \
            python-zeladoria

      - name: Smoke test no container
        run: |
          docker run -d \
            --name zelo-ci \
            -p 8001:8001 \
            -e DATABASE_URL="sqlite:///./zeladoria_ci.db" \
            -e SECRET_KEY="ci-test-key" \
            zelo-backend:ci

          # Aguarda startup
          sleep 8

          # Health check
          curl -f http://localhost:8001/health || \
            (docker logs zelo-ci && exit 1)

          docker stop zelo-ci
          docker rm zelo-ci

      - name: Limpeza
        if: always()
        run: docker rmi zelo-backend:ci --force || true
