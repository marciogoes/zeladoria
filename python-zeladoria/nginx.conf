# ============================================
# NGINX CONFIG - REVERSE PROXY
# Referenciado pelo docker-compose.yml
# Roteia / para o frontend e /api para o backend
# ============================================

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Log
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # Upstream: backend FastAPI
    upstream backend {
        server app:8001;
    }

    server {
        listen 80;
        server_name _;

        # Redireciona HTTP → HTTPS em produção real
        # return 301 https://$host$request_uri;

        # API e docs → FastAPI
        location /api/ {
            proxy_pass         http://backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /docs {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        location /health {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        location /uploads/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # Todo o resto → frontend
        location / {
            proxy_pass         http://frontend:80;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }
    }

    # HTTPS (habilite quando tiver SSL)
    # server {
    #     listen 443 ssl;
    #     server_name zeladoria.belem.pa.gov.br;
    #     ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ... mesmas locations acima ...
    # }
}
