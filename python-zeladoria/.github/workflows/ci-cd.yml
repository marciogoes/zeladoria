# ============================================
# GITHUB ACTIONS CI/CD
# Sistema de Zeladoria Urbana - Belém/PA
# ============================================

name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  DOCKER_IMAGE: zeladoria-urbana

jobs:
  # ==========================================
  # JOB 1: LINT E QUALIDADE DE CÓDIGO
  # ==========================================
  lint:
    name: Lint e Qualidade
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4
      
      - name: 🐍 Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort pylint
          pip install -r requirements.txt
      
      - name: 🔍 Executar Flake8
        run: |
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics
      
      - name: ⚫ Verificar Black
        run: black --check app/
      
      - name: 📑 Verificar isort
        run: isort --check-only app/

  # ==========================================
  # JOB 2: TESTES AUTOMATIZADOS
  # ==========================================
  test:
    name: Testes Automatizados
    runs-on: ubuntu-latest
    needs: lint
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: zeladoria_test
          POSTGRES_USER: zeladoria
          POSTGRES_PASSWORD: senha123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4
      
      - name: 🐍 Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio
      
      - name: 🧪 Executar testes
        env:
          DATABASE_URL: postgresql://zeladoria:senha123@localhost:5432/zeladoria_test
          SECRET_KEY: test-secret-key-for-ci
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term
      
      - name: 📊 Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  # ==========================================
  # JOB 3: ANÁLISE DE SEGURANÇA
  # ==========================================
  security:
    name: Análise de Segurança
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4
      
      - name: 🐍 Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: 🔒 Instalar Safety
        run: pip install safety
      
      - name: 🔍 Verificar vulnerabilidades
        run: safety check --json || true
      
      - name: 🛡️ Bandit Security Check
        run: |
          pip install bandit
          bandit -r app/ -f json -o bandit-report.json || true

  # ==========================================
  # JOB 4: BUILD DOCKER IMAGE
  # ==========================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'push'
    
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4
      
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: 🔑 Login to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: 📝 Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      
      - name: 🏗️ Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # JOB 5: DEPLOY (OPCIONAL)
  # ==========================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://zeladoria.belem.pa.gov.br
    
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4
      
      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd /opt/zeladoria
            docker-compose pull
            docker-compose up -d
            docker-compose exec -T app python seed.py
      
      - name: ✅ Verificar Health
        run: |
          sleep 30
          curl -f ${{ vars.APP_URL }}/health || exit 1

  # ==========================================
  # JOB 6: NOTIFICAÇÃO
  # ==========================================
  notify:
    name: Notificar Resultado
    runs-on: ubuntu-latest
    needs: [lint, test, security, build]
    if: always()
    
    steps:
      - name: 📧 Notificar sucesso
        if: ${{ success() }}
        run: |
          echo "✅ Pipeline executado com sucesso!"
      
      - name: 📧 Notificar falha
        if: ${{ failure() }}
        run: |
          echo "❌ Pipeline falhou!"

# ==========================================
# CONFIGURAÇÃO DE SECRETS NECESSÁRIOS
# ==========================================
#
# No GitHub, adicione os seguintes secrets:
# Settings → Secrets and variables → Actions → New repository secret
#
# Secrets necessários:
# - DOCKER_USERNAME: Usuário do Docker Hub
# - DOCKER_PASSWORD: Senha do Docker Hub
# - DEPLOY_HOST: Host do servidor de produção
# - DEPLOY_USER: Usuário SSH
# - DEPLOY_KEY: Chave privada SSH
#
# Variables (opcional):
# - APP_URL: URL da aplicação em produção
#
# ==========================================
