version: '3.8'

services:
  # Banco de Dados PostgreSQL
  postgres:
    image: postgis/postgis:15-3.3
    container_name: belem-zeladoria-db
    environment:
      POSTGRES_USER: zeladoria
      POSTGRES_PASSWORD: zeladoria123
      POSTGRES_DB: belem_zeladoria
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seeds:/docker-entrypoint-initdb.d/seeds
    networks:
      - belem-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeladoria"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis para cache e sessões
  redis:
    image: redis:7-alpine
    container_name: belem-zeladoria-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - belem-network
    command: redis-server --appendonly yes

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: belem-zeladoria-backend
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: belem_zeladoria
      DB_USER: zeladoria
      DB_PASSWORD: zeladoria123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: belem-zeladoria-secret-key-2024
      JWT_EXPIRES_IN: 7d
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - belem-network
    command: npm run dev

  # Frontend React
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: belem-zeladoria-frontend
    environment:
      VITE_API_URL: http://localhost:3000/api
      VITE_SOCKET_URL: http://localhost:3000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - belem-network
    command: npm run dev

  # Nginx (Proxy Reverso - Produção)
  nginx:
    image: nginx:alpine
    container_name: belem-zeladoria-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf
      - ./frontend/dist:/usr/share/nginx/html
    depends_on:
      - backend
      - frontend
    networks:
      - belem-network
    profiles:
      - production

  # PgAdmin (Gestão do Banco)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: belem-zeladoria-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@belem.pa.gov.br
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - belem-network
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local
  uploads:
    driver: local

networks:
  belem-network:
    driver: bridge
