# ============================================
# RENDER BLUEPRINT - DEPLOY AUTOMÁTICO
# Sistema de Zeladoria Urbana - Belém/PA
#
# Como usar:
#   1. Suba o projeto no GitHub
#   2. Acesse render.com e crie um novo "Blueprint"
#   3. Aponte para o repositório
#   4. Preencha as variáveis de ambiente marcadas com SUBSTITUA
# ============================================

services:
  # ==========================================
  # BACKEND - FastAPI
  # ==========================================
  - type: web
    name: zeladoria-backend
    runtime: docker
    dockerfilePath: ./python-zeladoria/Dockerfile
    dockerContext: ./python-zeladoria
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: zeladoria-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: ALLOWED_ORIGINS
        value: https://zeladoria-frontend.onrender.com
      - key: REDIS_HOST
        fromService:
          type: redis
          name: zeladoria-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: zeladoria-redis
          property: port

  # ==========================================
  # FRONTEND - React (Site Estático)
  # ==========================================
  - type: web
    name: zeladoria-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        value: https://zeladoria-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ==========================================
# BANCO DE DADOS
# ==========================================
databases:
  - name: zeladoria-db
    databaseName: zeladoria
    user: zeladoria
    plan: free

# ==========================================
# REDIS
# ==========================================
# Nota: Redis não está disponível no plano gratuito do Render.
# Se precisar de Redis, use Upstash (https://upstash.com) gratuitamente.
# Configure REDIS_HOST e REDIS_PORT manualmente nas envVars do backend.
